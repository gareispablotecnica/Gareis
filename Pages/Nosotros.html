<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Galería Interactiva</title>

<style>

body{
    font-family: Arial;
    background:#1e293b;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}

/* CONTENEDOR */

.contenedor{
    display:flex;
    gap:30px;
}

/* CIRCULOS */

.circulo{
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    cursor:pointer;
    border:4px solid white;
    transition:0.4s;
}

.circulo img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.circulo:hover{
    transform:scale(1.05);
}

.circulo.activo{
    transform:rotate(8deg) scale(1.1);
}

/* PANEL */

.info{
    width:0;
    opacity:0;
    overflow:hidden;
    background:white;
    border-radius:15px;
    transition:0.4s;
    padding:0;
}

.info.mostrar{
    width:280px;
    opacity:1;
    padding:20px;
}

.info h2{
    margin-top:0;
}

</style>
</head>
<body>

<div class="contenedor">

    <!-- CIRCULO 1 -->

    <div class="circulo"
         onclick="mostrarInfo(this,
         'Pablo',
         'Administrador del sistema')">

        <img src="https://picsum.photos/200?1">

    </div>

    <!-- CIRCULO 2 -->

    <div class="circulo"
         onclick="mostrarInfo(this,
         'María',
         'Encargada de ventas')">

        <img src="https://picsum.photos/200?2">

    </div>

    <!-- CIRCULO 3 -->

    <div class="circulo"
         onclick="mostrarInfo(this,
         'Carlos',
         'Área de soporte')">

        <img src="https://picsum.photos/200?3">

    </div>

    <!-- PANEL -->

    <div class="info" id="panel">

        <h2 id="titulo"></h2>

        <p id="texto"></p>

    </div>

</div>

<script>

let abierto = false;
let circuloActivo = null;

function mostrarInfo(elemento, nombre, descripcion){

    const panel = document.getElementById("panel");

    // SI HACE CLICK EN EL MISMO -> CERRAR
    if(circuloActivo === elemento && abierto){

        panel.classList.remove("mostrar");

        elemento.classList.remove("activo");

        abierto = false;
        circuloActivo = null;

        return;
    }

    // QUITAR ACTIVO A TODOS
    document.querySelectorAll(".circulo")
    .forEach(c => c.classList.remove("activo"));

    // ACTIVAR NUEVO
    elemento.classList.add("activo");

    // CAMBIAR TEXTO
    document.getElementById("titulo").innerText = nombre;

    document.getElementById("texto").innerText = descripcion;

    // MOSTRAR PANEL
    panel.classList.add("mostrar");

    abierto = true;
    circuloActivo = elemento;
}

</script>

</body>
</html>
